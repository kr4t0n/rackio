<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Rackio</title>
    <script>
      // Apply the persisted theme before first paint to avoid a flash.
      try {
        if (localStorage.getItem("rackio-theme") === "light") {
          document.documentElement.dataset.theme = "light";
        }
        // Wallpaper shell: go transparent before first paint so the macOS
        // desktop app never flashes an opaque rectangle over the wallpaper.
        // Mirrors src/app/shell.ts — keep the two in sync.
        if (new URLSearchParams(location.search).get("shell") === "wallpaper") {
          document.documentElement.dataset.shell = "wallpaper";
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
