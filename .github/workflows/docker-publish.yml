name: docker-publish

# Builds the Rackio image for linux/amd64 + linux/arm64 and pushes it to
# Docker Hub as a single multi-arch manifest.
#
# Architecture (same shape as argus):
#   1. `build` runs *per-platform on native runners* — amd64 on
#      ubuntu-latest, arm64 on ubuntu-24.04-arm. Each pushes by digest
#      only (no tag) and exports its sha256 as a tiny artifact. Native
#      runners avoid the QEMU emulation that dominates wall-clock time
#      on a cache miss.
#   2. `merge` waits for both platforms, downloads the digests, and runs
#      `docker buildx imagetools create` to bind the tag list to the
#      per-arch digests. No re-build, no re-push of layers.
#
# Triggers:
#   - push to main → publishes :latest, :main, :sha-<short>
#   - push of a `v*` tag (e.g. v0.1.0) → :latest, :0.1.0, :0.1, :sha-<short>
#   - manual workflow_dispatch → adds :manual-<run_id>
#   - PR against main → build-only smoke test, no push.
#
# Image name defaults to `${DOCKERHUB_USERNAME}/rackio`.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
    paths:
      # Only re-run the (slow) Docker build when something that actually
      # affects the image changes.
      - 'src/**'
      - 'server/**'
      - 'shared/**'
      - 'public/**'
      - 'index.html'
      - 'Dockerfile'
      - '.dockerignore'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:
    inputs:
      push:
        description: 'Push to Docker Hub (uncheck for build-only smoke test)'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Stage 1: per-platform build (native runners) ────────────────────
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve push flag
        id: pushflag
        run: |
          # PRs always smoke-test only — never push from an unmerged
          # change. Manual dispatches honor the input toggle.
          case "${{ github.event_name }}" in
            pull_request)       echo "push=false" >> "$GITHUB_OUTPUT" ;;
            workflow_dispatch)  echo "push=${{ inputs.push }}" >> "$GITHUB_OUTPUT" ;;
            *)                  echo "push=true"  >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Login to Docker Hub
        if: steps.pushflag.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Labels only — the per-platform build writes by digest with no
      # tags; `merge` computes the actual tag list.
      - name: Compute labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/rackio
          labels: |
            org.opencontainers.image.title=rackio
            org.opencontainers.image.description=Grid-based dashboard for the services on your rack
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT

      - name: Build and push by digest
        id: build
        if: steps.pushflag.outputs.push == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ secrets.DOCKERHUB_USERNAME }}/rackio,push-by-digest=true,name-canonical=true,push=true
          # Cache scoped per platform so the two parallel jobs don't race
          # to overwrite each other's manifest in the cache backend.
          cache-from: type=gha,scope=rackio-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=rackio-${{ matrix.platform }}
          provenance: false

      - name: Build (smoke test, no push)
        if: steps.pushflag.outputs.push != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          push: false
          cache-from: type=gha,scope=rackio-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=rackio-${{ matrix.platform }}
          provenance: false

      # Persist the digest as a zero-byte file named after the sha so the
      # merge job can collect every platform's digest without parsing.
      - name: Export digest
        if: steps.pushflag.outputs.push == 'true'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest='${{ steps.build.outputs.digest }}'
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: steps.pushflag.outputs.push == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # ── Stage 2: assemble the multi-arch manifest ───────────────────────
  merge:
    name: merge manifest
    needs: build
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push)
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/rackio
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,prefix=sha-
            type=raw,value=manual-${{ github.run_id }},enable=${{ github.event_name == 'workflow_dispatch' }}

      # Stitch the per-arch digests into one manifest list per tag, so all
      # tags resolve to the same digest without a second build.
      - name: Create multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          # Word-splitting is intentional: imagetools wants one CLI arg
          # per `-t TAG` and one per `<image>@<digest>` source.
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ secrets.DOCKERHUB_USERNAME }}/rackio@sha256:%s ' *)

      - name: Inspect published image
        run: |
          docker buildx imagetools inspect \
            "${{ secrets.DOCKERHUB_USERNAME }}/rackio:${{ steps.meta.outputs.version }}"
