name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Catches chart syntax/template errors on PRs, before helm-publish
  # (which lints again) ever runs on main.
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.17.0

      - name: Lint chart
        run: helm lint helm/rackio

      - name: Render default values
        run: helm template rackio helm/rackio > /dev/null

      - name: Render tailscale example
        run: |
          helm template rackio helm/rackio \
            -f helm/rackio/examples/values.tailscale.yaml > /dev/null
