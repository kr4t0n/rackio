# ─────────────────────────────────────────────────────────────────────
# Rackio on Kubernetes — Tailscale Ingress example
#
# The Ingress object becomes its own tailnet device, so the board gets an
# auto-issued HTTPS cert from Tailscale and is reachable at
# https://rackio.<your-tailnet>.ts.net (and as `rackio` via MagicDNS
# from inside the tailnet).
#
# Prerequisite: the Tailscale Kubernetes operator is installed —
#   https://tailscale.com/kb/1236/kubernetes-operator
#
# Install:
#   helm repo add rackio https://kr4t0n.github.io/rackio/helm
#   helm install rackio rackio/rackio \
#     --namespace rackio --create-namespace \
#     -f examples/values.tailscale.yaml
# ─────────────────────────────────────────────────────────────────────

ingress:
  enabled: true
  className: tailscale
  hosts:
    # The host becomes the tailnet device name.
    - host: rackio
      paths:
        - path: /
          pathType: Prefix
  tls:
    # Required: the tls block is how the tailscale controller learns the
    # device name. No secretName — Tailscale issues the cert itself.
    - hosts:
        - rackio
  # Optional: pin the device to an ACL tag, or expose it publicly.
  # annotations:
  #   tailscale.com/tags: "tag:rackio"
  #   tailscale.com/funnel: "true"
  annotations: {}

# The board, saved integration credentials, and the Calibre cover cache
# live here. Longhorn/local-path/NFS all work — any RWO class will do.
persistence:
  enabled: true
  storageClass: ""    # cluster default
  size: 1Gi

# Integrations (Calibre, calendar, AdGuard, downloaders) are connected
# from each card's settings once rackio is running — there is no chart
# value or environment variable for them. Credentials are validated
# against the live service and stored on the volume above.
#
# Reaching LAN services happens from the POD, not your browser — make
# sure the addresses you enter are routable from inside the cluster.
